name: umbrella

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.7
    container_name: umbrella-clickhouse
    ports:
      # 9000 — нативный протокол, его использует internal/storage/clickhouse
      # (clickhouse-go/v2, PrepareBatch/Append/Send).
      - "9000:9000"
      # 8123 — HTTP, удобно для ручной проверки: curl/clickhouse-client/
      # встроенный веб-плей (http://localhost:8123/play).
      - "8123:8123"
    environment:
      CLICKHOUSE_DB: umbrella
      CLICKHOUSE_USER: umbrella
      CLICKHOUSE_PASSWORD: umbrella
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # Выполняется один раз при первом старте (пустой /var/lib/clickhouse) —
      # создаёт таблицу под схему, которую ожидает internal/storage/clickhouse.
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping" ]
      interval: 2s
      timeout: 2s
      retries: 30

  # Redpanda — Kafka-совместимый брокер (тот же wire-протокол, kafka-go его
  # не отличает от настоящего Kafka)
  # хотел глянуть что такое
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.2
    container_name: umbrella-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9093,external://0.0.0.0:9092
      - --advertise-kafka-addr
      - internal://redpanda:9093,external://localhost:9092
      - --rpc-addr
      - redpanda:33145
      - --advertise-rpc-addr
      - redpanda:33145
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - 1G
    ports:
      # 9092 — внешний listener, то, к чему подключается internal/storage/kafka
      # с хоста (localhost:9092). 9093 — внутренний, для других контейнеров
      # той же compose-сети (сейчас не используется, но так их не спутать).
      - "9092:9092"
      # 9644 — Admin API, на нём же health-эндпоинт.
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: [ "CMD", "rpk", "cluster", "health" ]
      interval: 2s
      timeout: 5s
      retries: 30

  # Prometheus скрейпит /metrics у collector'а. collector в этом стеке всегда
  # запускается на хосте (make run-collector), не как отдельный сервис
  # compose, поэтому таргет — host.docker.internal, а не имя сервиса.
  prometheus:
    image: prom/prometheus:v3.7.3
    container_name: umbrella-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      # На Linux host.docker.internal не резолвится без этой строчки; на
      # Docker Desktop (mac/Windows) она безвредна — он настраивает алиас сам.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy" ]
      interval: 2s
      timeout: 2s
      retries: 30

  grafana:
    image: grafana/grafana:12.3.0
    container_name: umbrella-grafana
    ports:
      - "3000:3000"
    environment:
      # Локальный дашборд без пароля — не для прод-конфигурации.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health" ]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  clickhouse-data:
  redpanda-data:
  prometheus-data:
