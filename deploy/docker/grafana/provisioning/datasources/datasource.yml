# Автоматически регистрирует Prometheus как datasource при старте Grafana —
# без этого файла пришлось бы добавлять его руками через UI при каждом
# пересоздании контейнера (volume для Grafana тут не используется).
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
